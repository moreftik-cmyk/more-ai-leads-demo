<body><div class="app"><header class="topbar"><div class="brand"><div class="logo">מ׳</div><div><strong>מור AI</strong><small>ניהול פניות ודמואים מותאמים</small></div></div><nav class="mainnav"><button class="active" data-view="overview">סקירה</button><button data-view="leads">פניות</button><button data-view="demos">הדמואים שלי</button></nav><div class="top-actions"><button class="ghost" id="openIntake">+ פנייה חדשה</button><div class="avatar">מ</div></div></header><main class="content" id="app"></main></div>
<div class="drawer" id="drawer"><aside class="drawer-card" id="drawerCard"></aside></div><div class="modal-back" id="modalBack"><div class="modal"><div style="display:flex;justify-content:space-between;gap:12px"><div><h2>קליטת פנייה חדשה</h2><p class="modal-intro">כמה תשובות קצרות יעזרו לנו להכין דמו שמדבר בדיוק על העסק.</p></div><button class="close" id="closeModal">×</button></div><div class="steps"><span class="active"></span><span></span><span></span></div><form id="intakeForm"><section class="step-content active" data-step="1"><div class="field"><label>איך קוראים לעסק שלך?</label><input name="business" placeholder="למשל: סטודיו לפילאטיס" required></div><div class="field"><label>כמה אנשים עובדים בעסק?</label><select name="size"><option>רק אני</option><option>2–5</option><option>6–20</option><option>יותר מ־20</option></select></div><div class="modal-actions"><span></span><button class="primary" type="button" data-next>המשך</button></div></section><section class="step-content" data-step="2"><div class="field"><label>מה גוזל מכם הכי הרבה זמן?</label><div class="choice-grid">${['מעקב אחרי לקוחות','תיאומים','הצעות מחיר','גבייה','הזנת נתונים','ניהול משימות'].map(x=>`<label class="choice"><input type="checkbox" name="needs" value="${x}">${x}</label>`).join('')}</div></div><div class="field"><label>באילו מערכות אתם משתמשים כיום?</label><input name="systems" placeholder="WhatsApp, Excel, מערכת הנהלת חשבונות"></div><div class="modal-actions"><button class="ghost" type="button" data-prev>חזרה</button><button class="primary" type="button" data-next>המשך</button></div></section><section class="step-content" data-step="3"><div class="field"><label>מה הכי חשוב לכם לשפר, ואיך התהליך מתנהל היום?</label><textarea name="story" rows="4" placeholder="אפשר לכתוב או להקליט תשובה קולית קצרה"></textarea></div><div class="field"><label>איך אפשר לחזור אליכם?</label><input name="contact" placeholder="שם + טלפון או WhatsApp" required></div><div class="modal-actions"><button class="ghost" type="button" data-prev>חזרה</button><button class="primary" type="submit">שליחת הפנייה</button></div></section></form></div></div><div class="toast" id="toast"></div>
<script>const MorAI = (() => {
  const state = {
    view: 'overview',
    query: '',
    selectedId: null,
    portal: 'מור AI',
    leads: [
      { id: 1, name: 'רונית לוי', business: 'סטודיו פילאטיס', status: 'new', priority: 'גבוהה', need: 'מעקב אחרי מתעניינות ותיאום שיעורים', received: 'היום, 09:42', contact: '050-1234567', systems: 'WhatsApp, Google Sheets' },
      { id: 2, name: 'אורי כהן', business: 'שירותי אחזקה', status: 'work', priority: 'בינונית', need: 'הצעות מחיר, תיאום צוות ומעקב לקוחות', received: 'אתמול, 16:20', contact: '052-9876543', systems: 'WhatsApp, Excel' },
      { id: 3, name: 'שירה אדרי', business: 'קליניקה פרטית', status: 'work', priority: 'בינונית', need: 'קליטת פנייה, תזכורות ותיאום פגישות', received: 'אתמול, 13:05', contact: '054-7654321', systems: 'יומן, WhatsApp' },
      { id: 4, name: 'תמר פרץ', business: 'חנות אונליין', status: 'sent', priority: 'נמוכה', need: 'שיווק, שירות ומעקב אחר הזמנות', received: '02.11.26', contact: '053-2223344', systems: 'Shopify, Mailchimp' },
      { id: 5, name: 'גיא ברק', business: 'משרד תכנון', status: 'sent', priority: 'נמוכה', need: 'ניהול משימות, מסמכים והצעות ללקוחות', received: '01.11.26', contact: '050-5556677', systems: 'Drive, Email' }
    ]
  };
  const labels = { new: 'פנייה חדשה', work: 'בטיפול', sent: 'דמו נשלח' };
  const statusLabel = status => labels[status] || status;
  const filtered = () => state.leads.filter(l => !state.query || `${l.name} ${l.business} ${l.need}`.includes(state.query));
  const metrics = () => ({ new: state.leads.filter(l => l.status === 'new').length, work: state.leads.filter(l => l.status === 'work').length, sent: state.leads.filter(l => l.status === 'sent').length });
  const select = id => { state.selectedId = id; };
  const addLead = data => { const lead = { id: Date.now(), name: data.name || 'פנייה חדשה', business: data.business || 'עסק חדש', status: 'new', priority: 'חדשה', need: data.need || 'טרם נותח', received: 'עכשיו', contact: data.contact || 'טרם צוין', systems: data.systems || 'טרם צוין' }; state.leads.unshift(lead); state.selectedId = lead.id; return lead; };
  const getSelected = () => state.leads.find(l => l.id === state.selectedId) || null;
  return { state, labels, statusLabel, filtered, metrics, select, addLead, getSelected };
})();

if (typeof window !== 'undefined') window.MorAI = MorAI;
if (typeof module !== 'undefined') module.exports = MorAI;
</script>
<script>
const shell=document.querySelector('.app');shell.insertAdjacentHTML('afterbegin','<aside class="portal-sidebar"><div class="portal-title">הפורטלים שלי</div><div class="portal-list"><button class="portal active" data-portal="מור AI"><span class="portal-icon">✦</span><span>מור AI</span></button><button class="portal" data-portal="לידים ודמואים"><span class="portal-icon">◈</span><span>לידים ודמואים</span></button><button class="portal" data-portal="לקוחות"><span class="portal-icon">◌</span><span>לקוחות</span></button><button class="portal" data-portal="משימות"><span class="portal-icon">✓</span><span>משימות</span></button><button class="portal" data-portal="דוחות"><span class="portal-icon">▥</span><span>דוחות</span></button></div><div class="sidebar-note"><strong>מרכז העבודה שלך</strong>כל הפורטלים העסקיים במקום אחד, עם מעבר מהיר בין המערכות.</div></aside>');

const choiceGrid=document.querySelector('.choice-grid'); if(choiceGrid && choiceGrid.textContent.includes('${[')){choiceGrid.innerHTML='<label class="choice"><input type="checkbox" name="needs" value="מעקב אחרי לקוחות">מעקב אחרי לקוחות</label><label class="choice"><input type="checkbox" name="needs" value="תיאומים">תיאומים</label><label class="choice"><input type="checkbox" name="needs" value="הצעות מחיר">הצעות מחיר</label><label class="choice"><input type="checkbox" name="needs" value="גבייה">גבייה</label><label class="choice"><input type="checkbox" name="needs" value="הזנת נתונים">הזנת נתונים</label><label class="choice"><input type="checkbox" name="needs" value="ניהול משימות">ניהול משימות</label>'}

function renderPortal(){const name=MorAI.state.portal;app.innerHTML=`<div class="page-head"><div><div class="eyebrow">הפורטל שלך</div><h1>${esc(name)}</h1><p>המרחב הזה מוכן להתחבר למערכת המתאימה.</p></div><button class="primary" id="backToMorAI">חזרה למור AI</button></div><div class="grid"><section class="panel"><div class="panel-head"><div><h2>${esc(name)} בפעולה</h2><p>מסך הדגמה של הפורטל — נתוני דמו בלבד</p></div></div><div style="padding:24px"><div class="detail-section"><label>מה יהיה כאן</label><p>רשימות, פעולות ונתונים הקשורים ל${esc(name)} — מחוברים למרכז העבודה של מור AI.</p></div><button class="primary" id="portalAction">פתיחת סביבת ${esc(name)}</button></div></section><aside class="insight"><h2>הכול מחובר</h2><p>המעבר בין הפורטלים נשאר קבוע, כך שכל מערכת חדשה מקבלת את אותה פריסת עבודה.</p></aside></div>`;document.querySelector('#backToMorAI').onclick=()=>{MorAI.state.portal='מור AI';render()};document.querySelector('#portalAction').onclick=()=>notify(`סביבת ${name} תיפתח בגרסת המערכת המלאה`);bindCommon()}

ן</b> עבר לטיפול</p><small>אתמול, 16:20</small></div></div><div class="activity-item"><i class="activity-dot" style="background:var(--purple)"></i><div><p><b>תמר פרץ</b> קיבלה דמו</p><small>02.11.26</small></div></div></section></aside></div>`;bindCommon()}

function renderLeads(){app.innerHTML=`<div class="page-head"><div><div class="eyebrow">ניהול פניות</div><h1>כל הפניות</h1><p>מקום אחד לראות, להבין ולקדם כל פנייה.</p></div><button class="primary" id="headIntake">+ פנייה חדשה</button></div><section class="panel"><div class="panel-head"><div><h2>רשימת פניות</h2><p>נתוני דמו בלבד</p></div><input class="search" id="search" placeholder="חיפוש לפי שם או צורך..."></div>${table(MorAI.filtered())}</section>`;document.querySelector('#search').value=MorAI.state.query;document.querySelector('#search').oninput=e=>{MorAI.state.query=e.target.value;renderLeads();bindRows()};bindCommon()}
function renderDemos(){app.innerHTML=`<div class="page-head"><div><div class="eyebrow">ספריית עבודה</div><h1>הדמואים שלי</h1><p>תבניות קצרות שאפשר להתאים לכל עסק.</p></div><button class="primary" id="headIntake">+ יצירת דמו</button></div><div class="grid"><section class="panel"><div class="panel-head"><div><h2>דמואים מוכנים</h2><p>מבוססים על צרכים שחוזרים בפניות</p></div></div><div style="padding:22px;display:grid;gap:12px"><div class="detail-section" style="border:1px solid var(--line);border-radius:16px;padding:16px"><b>מעקב לקוחות ותיאומים</b><p class="sub">לדוגמה: סטודיו, קליניקה, נותני שירות</p><span class="status sent">מוכן לשליחה</span></div><div class="detail-section" style="border:1px solid var(--line);border-radius:16px;padding:16px"><b>הצעות מחיר וניהול משימות</b><p class="sub">לדוגמה: שירותי אחזקה, משרדים מקצועיים</p><span class="status work">התאמה נדרשת</span></div></div></section><aside class="insight"><h2>מור AI מתאימה את הדמו</h2><p>אחרי שמבינים את העסק, בוחרים את התהליך שהכי נכון להמחיש ומציגים תוצאה — לא רק מסך.</p></aside></div>`;bindCommon()}

function openDrawer(id){MorAI.select(id);const l=MorAI.getSelected();drawerCard.innerHTML=`<div class="drawer-head"><div><div class="eyebrow">${MorAI.statusLabel(l.status)}</div><h2>${esc(l.name)}</h2><p>${esc(l.business)}</p></div><button class="close" id="closeDrawer">×</button></div><div class="detail-section"><label>הצורך שזוהה</label><p>${esc(l.need)}</p></div><div class="detail-section"><label>מערכות קיימות</label><p>${esc(l.systems)}</p></div><div class="detail-section"><label>פרטי קשר</label><p>${esc(l.contact)}</p></div><div class="detail-section"><label>תאריך קבלת הפנייה</label><p>${esc(l.received)}</p></div><div class="detail-section"><label>הפעולה הבאה</label><p>${l.status==='new'?'להעביר לטיפול ולבנות דמו מותאם':l.status==='work'?'להכין ולשלוח דמו':'לבצע מעקב מול הלקוח'}</p></div><div style="display:grid;gap:9px;margin-top:12px"><button class="primary" id="markWork">${l.status==='new'?'העברה לטיפול':l.status==='work'?'הכנת דמו':'פתיחת מעקב'}</button><button class="ghost" id="addNote">הוספת הערה</button></div>`;drawer.classList.add('open');document.querySelector('#closeDrawer').onclick=()=>drawer.classList.remove('open');document.querySelector('#markWork').onclick=()=>{if(l.status==='new'){l.status='work';notify('הפנייה הועברה לטיפול — אפשר להתחיל להכין דמו');openDrawer(l.id)}else if(l.status==='work'){l.status='sent';notify('הדמו סומן כמוכן לשליחה — בדמו בלבד');openDrawer(l.id)}else{notify('נפתח שלב המעקב — בדמו בלבד')}};document.querySelector('#addNote').onclick=()=>notify('שדה הערות ייפתח כאן במערכת המלאה — בדמו בלבד')}
function openModal(){modal.classList.add('open');showStep(1)}function closeModal(){modal.classList.remove('open');document.querySelector('#intakeForm').reset();showStep(1)}function showStep(n){document.querySelectorAll('.step-content').forEach(x=>x.classList.toggle('active',x.dataset.step==n));document.querySelectorAll('.steps span').forEach((x,i)=>x.classList.toggle('active',i<n))}document.querySelector('#closeModal').onclick=closeModal;document.querySelector('#modalBack').onclick=e=>{if(e.target===modal)closeModal()};document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>showStep(Number(document.querySelector('.step-content.active').dataset.step)+1));document.querySelectorAll('[data-prev]').forEach(b=>b.onclick=()=>showStep(Number(document.querySelector('.step-content.active').dataset.step)-1));document.querySelector('#intakeForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);MorAI.addLead({name:f.get('contact'),business:f.get('business'),need:'נוספה דרך טופס הדמו',systems:f.get('systems'),contact:f.get('contact')});closeModal();MorAI.state.view='overview';notify('הפנייה נוספה לדשבורד — נתוני דמו בלבד');render()};function notify(t){toastEl.textContent=t;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),2400)}render();
</script><script>

const stepTwo=document.querySelector('[data-step="2"]');const needsLabel=stepTwo?.querySelector('.field label');if(needsLabel)needsLabel.textContent='אילו משימות או תהליכים גוזלים מכם הכי הרבה זמן?';const systemsField=document.querySelector('input[name="systems"]');if(systemsField){systemsField.placeholder='כתבו כאן את המערכות והכלים שלכם';const label=systemsField.closest('.field')?.querySelector('label');if(label)label.textContent='באילו מערכות וכלים אתם משתמשים כיום?';systemsField.insertAdjacentHTML('afterend','<small class="recording-help">למשל: מערכת ניהול או CRM, הנהלת חשבונות, יומן, סליקה ותשלומים, שיווק ועוד.</small>');systemsField.closest('.field')?.insertAdjacentHTML('afterend','<div class="field"><label>איפה מתנהלת רוב העבודה העסקית שלכם, ואיפה נשמר רוב המידע?</label><select name="main_channel" required><option value="" disabled selected>בחירת דרך ההתנהלות המרכזית</option><option>WhatsApp</option><option>דוא״ל</option><option>מערכת CRM או מערכת ניהול</option><option>Excel או Google Sheets</option><option>כמה מערכות במקביל</option><option>אין מקום מרכזי שבו המידע מרוכז</option><option>אחר</option></select></div>')}
function formatTime(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function stopRecording(){if(recording.recorder&&recording.recorder.state!=='inactive')recording.recorder.stop();if(recording.stream)recording.stream.getTracks().forEach(t=>t.stop());clearInterval(recording.timer);recordBtn?.classList.remove('recording');if(recordBtn)recordBtn.textContent='🎙️ הקלטת תשובה'}
if(recordBtn)recordBtn.onclick=async()=>{if(recording.recorder?.state==='recording'){stopRecording();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){notify('הדפדפן לא מאפשר הקלטה בדמו הזה');return}try{recording.stream=await navigator.mediaDevices.getUserMedia({audio:true});recording.chunks=[];recording.seconds=0;recording.recorder=new MediaRecorder(recording.stream);recording.recorder.ondataavailable=e=>{if(e.data.size)recording.chunks.push(e.data)};recording.recorder.onstop=()=>{recording.blob=new Blob(recording.chunks,{type:'audio/webm'});recordAudio.src=URL.createObjectURL(recording.blob);recordAudio.classList.remove('hide');recordTimer.textContent=`${formatTime(recording.seconds)} / 02:00`};recording.recorder.start();recordBtn.classList.add('recording');recordBtn.textContent='⏹ עצירת הקלטה';recording.timer=setInterval(()=>{recording.seconds++;recordTimer.textContent=`${formatTime(recording.seconds)} / 02:00`;if(recording.seconds>=120)stopRecording()},1000)}catch(e){notify('לא ניתנה הרשאה למיקרופון — אפשר לענות בכתב')}};
function validateStep(n){if(n===1){return document.querySelector('[data-step="1"] input[name="business"]').reportValidity()&&document.querySelector('[data-step="1"] select[name="size"]').reportValidity()}if(n===2){const checked=document.querySelector('[data-step="2"] input[name="needs"]:checked');const systems=document.querySelector('[data-step="2"] input[name="systems"]');const channel=document.querySelector('[data-step="2"] select[name="main_channel"]');if(!checked){notify('יש לבחור לפחות משימה אחת');return false}if(!systems.value.trim()){systems.setCustomValidity('נא לציין באילו מערכות משתמשים כיום');systems.reportValidity();systems.setCustomValidity('');return false}return channel.reportValidity()}return true}
document.querySelectorAll('[data-next]').forEach(btn=>btn.onclick=()=>{const current=Number(document.querySelector('.step-content.active').dataset.step);if(validateStep(current))showStep(current+1)});
function resetRecording(){if(recording.recorder?.state==='recording')stopRecording();recording.blob=null;recording.chunks=[];if(recordAudio){recordAudio.removeAttribute('src');recordAudio.classList.add('hide')}if(recordTimer)recordTimer.textContent='00:00 / 02:00'}
document.addEventListener('click',e=>{if(e.target.closest('#openIntake,#headIntake'))resetRecording()});document.querySelector('#closeModal')?.addEventListener('click',resetRecording);
const form=document.querySelector('#intakeForm');if(form)form.onsubmit=e=>{e.preventDefault();const storyText=story?.value.trim();if(!storyText&&!recording.blob){notify('יש לכתוב תשובה או להקליט תשובה קולית');return}const f=new FormData(form);MorAI.addLead({name:f.get('contact'),business:f.get('business'),need:'נוספה דרך טופס הדמו',systems:`${f.get('main_channel')} · ${f.get('systems')}`,contact:f.get('contact')});closeModal();MorAI.state.view='overview';notify('הפנייה נוספה לדשבורד — נתוני דמו בלבד');render()};

document.querySelectorAll('#openIntake,#headIntake').forEach(button=>button.onclick=openModal);
document.querySelector('#closeModal').onclick=closeModal;
validateStep=n=>{if(n===1)return document.querySelector('[data-step="1"] input[name="business"]').reportValidity()&&document.querySelector('[data-step="1"] select[name="size"]').reportValidity();if(n===2){const checked=document.querySelector('[data-step="2"] input[name="needs"]:checked');const systems=document.querySelector('[data-step="2"] input[name="systems"]');const channels=document.querySelectorAll('[data-step="2"] input[name="main_channel"]:checked');if(!checked){notify('יש לבחור לפחות משימה אחת');return false}if(!systems.value.trim()){systems.setCustomValidity('נא לציין באילו מערכות משתמשים כיום');systems.reportValidity();systems.setCustomValidity('');return false}if(!channels.length){notify('יש לבחור לפחות דרך התנהלות אחת');return false}return true}return true};
if(intakeForm) intakeForm.onsubmit=e=>{e.preventDefault();const storyText=story?.value.trim();if(!storyText&&!recording.blob){notify('יש לכתוב תשובה או להקליט תשובה קולית');return}if(!document.querySelector('[name="full_name"]').reportValidity()||!document.querySelector('[name="phone"]').reportValidity())return;const channels=[...document.querySelectorAll('[name="main_channel"]:checked')].map(x=>x.value);if(!channels.length){notify('יש לבחור לפחות דרך התנהלות אחת');return}const f=new FormData(intakeForm);MorAI.addLead({name:f.get('full_name'),business:f.get('business'),need:'נוספה דרך טופס הדמו',systems:`${channels.join(', ')} · ${f.get('systems')}`,contact:`${f.get('full_name')} · ${f.get('phone')}`});intakeForm.classList.add('hide');document.querySelector('.steps')?.classList.add('hide');thankYou.classList.remove('hide');};
const previousValidateStep=validateStep;
validateStep=n=>{if(n===1){const type=document.querySelector('[data-step="1"] input[name="business_type"]');if(!type?.reportValidity())return false}return previousValidateStep(n)};
const originalSubmitHandler=intakeForm?.onsubmit;
document.addEventListener('submit',event=>{if(event.target===intakeForm){const business=intakeForm.querySelector('[name="business"]'),type=intakeForm.querySelector('[name="business_type"]');if(business&&type&&type.value.trim())business.value=`${business.value.trim()} · ${type.value.trim()}`}},true);
if(intakeForm) intakeForm.addEventListener('submit',()=>{const f=new FormData(intakeForm);if(f.get('business_type')) intakeForm.dataset.businessType=f.get('business_type')});
if(location.pathname.endsWith('/index.html') || location.pathname.endsWith('/') || location.pathname.endsWith('/new.html')) setTimeout(openModal,120);
</script></body></html>
